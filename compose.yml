services:
  mysql:
    image: mysql:8.4
    # Migration V11 creates triggers. The non-root application user paspm has no SUPER privilege and MySQL 8.4 enables
    # binary logging, so without this flag Flyway stops with "You do not have the SUPER privilege and binary logging is enabled".
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: paspm
      MYSQL_USER: paspm
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["paspm_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  paspm_mysql:
