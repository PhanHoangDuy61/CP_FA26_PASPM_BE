# Optional local/deployment-shaped Backend service. Build the image first; run with compose.yml.
services:
  backend:
    image: ${PASPM_BACKEND_IMAGE:-paspm-backend:local}
    init: true
    mem_limit: 1g
    cpus: 2.0
    ports:
      - "127.0.0.1:${PASPM_BACKEND_HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_URL: jdbc:mysql://mysql:3306/paspm?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: paspm
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      OTP_SECRET: ${OTP_SECRET:?Set OTP_SECRET}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      mysql:
        condition: service_healthy
