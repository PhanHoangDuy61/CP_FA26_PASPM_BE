name: Backend full verification (manual, all opt-ins)

# Manual only. Run it before a review or a release. It is NOT part of the pull-request checks and does not change
# the test selection of backend-verification.yml. See DEC-20261125-05 and .github/scripts/allowed-skips.txt.
on:
  workflow_dispatch:
    inputs:
      legacy_ref:
        description: >-
          Optional git ref (commit/tag/branch) of the OLD backend to build and use as -Dpaspm.test.legacy-jar
          (MiningSchedulerUpgradeCompatibilityMySqlTest.characterizeTheOldBackendRunningOnTheNewSchema).
          Empty = that one test stays skipped and is reported as an allowed skip.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: backend-full-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    name: Full suite, every opt-in that can run on disposable synthetic data
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      PASPM_CI_DISPOSABLE_MYSQL: 'true'
      PASPM_TEST_MYSQL_SERVER: jdbc:mysql://127.0.0.1:3306/
      PASPM_TEST_MYSQL_USER: root
      PASPM_TEST_MYSQL_PASSWORD: ''
      PASPM_CI_SPMF_ARTIFACT_URL: ${{ vars.PASPM_CI_SPMF_ARTIFACT_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Provision separate SPMF Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Retain child executable
        run: echo "SPMF_JAVA_PATH=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - name: Provision Backend Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set isolated artifact destination
        run: echo "SPMF_JAR_PATH=$RUNNER_TEMP/spmf.jar" >> "$GITHUB_ENV"
      - name: Verify approved external artifact
        run: python3 .github/scripts/provision-spmf.py
      - name: Verify SPMF version before use
        shell: bash
        run: |
          version="$("$SPMF_JAVA_PATH" -Djava.awt.headless=true -jar "$SPMF_JAR_PATH" version)"
          [[ "$version" == *"-- SPMF version 2.67a --"* ]]
          printf '%s\n' "$version"
      - name: Prepare disposable MySQL tools and restore helper
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paspm-bin" "$RUNNER_TEMP/paspm-tmp"
          chmod +x .github/scripts/mysql-client.sh .github/scripts/provision-restore.py
          ln -s "$GITHUB_WORKSPACE/.github/scripts/mysql-client.sh" "$RUNNER_TEMP/paspm-bin/mysql"
          ln -s "$GITHUB_WORKSPACE/.github/scripts/mysql-client.sh" "$RUNNER_TEMP/paspm-bin/mysqldump"
          echo "$RUNNER_TEMP/paspm-bin" >> "$GITHUB_PATH"
          echo "PASPM_TEST_RESTORE_PROVISIONER=$GITHUB_WORKSPACE/.github/scripts/provision-restore.py" >> "$GITHUB_ENV"
          echo "PASPM_MINING_SPMF_JAR=$SPMF_JAR_PATH" >> "$GITHUB_ENV"
          echo "PASPM_MINING_JAVA_EXECUTABLE=$SPMF_JAVA_PATH" >> "$GITHUB_ENV"
      - name: Build the legacy backend jar (only when legacy_ref is given)
        if: ${{ inputs.legacy_ref != '' }}
        shell: bash
        env:
          LEGACY_REF: ${{ inputs.legacy_ref }}
        run: |
          git init "$RUNNER_TEMP/legacy-src"
          git -C "$RUNNER_TEMP/legacy-src" fetch --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$LEGACY_REF"
          git -C "$RUNNER_TEMP/legacy-src" checkout --detach FETCH_HEAD
          (cd "$RUNNER_TEMP/legacy-src" && mvn --batch-mode --no-transfer-progress -DskipTests package)
          jar="$(ls "$RUNNER_TEMP"/legacy-src/target/*.jar | grep -v -- '-plain' | head -1)"
          cp "$jar" "$RUNNER_TEMP/legacy-backend.jar"
          echo "PASPM_LEGACY_JAR=$RUNNER_TEMP/legacy-backend.jar" >> "$GITHUB_ENV"
      - name: Full Backend verification, every runnable opt-in enabled
        shell: bash
        run: |
          java -version
          "$SPMF_JAVA_PATH" -version
          legacy=()
          if [[ -n "${PASPM_LEGACY_JAR:-}" ]]; then legacy=("-Dpaspm.test.legacy-jar=$PASPM_LEGACY_JAR"); fi
          mvn --batch-mode --no-transfer-progress clean verify \
            -DargLine="-Djava.io.tmpdir=$RUNNER_TEMP/paspm-tmp" \
            -Dpaspm.test.mysql=true \
            -Dpaspm.test.java17-backend=true \
            -Dpaspm.test.multijvm=true \
            -Dpaspm.test.natural-lease=true \
            -Dpaspm.test.foodmart-e2e=true \
            "${legacy[@]}" \
            -Dpaspm.test.java17="$JAVA_HOME/bin/java" \
            -Dpaspm.test.spmf-jar="$SPMF_JAR_PATH" \
            -Dpaspm.test.spmf-java="$SPMF_JAVA_PATH" \
            -Dpaspm.avatar.directory="$RUNNER_TEMP/avatars" \
            -Dlogging.level.root=ERROR
      - name: Opt-in import benchmark (synthetic data, no assertions on timing)
        shell: bash
        run: |
          mvn --batch-mode --no-transfer-progress test \
            -Dtest=F04ImportPerformanceMySqlBenchmark \
            -DargLine="-Djava.io.tmpdir=$RUNNER_TEMP/paspm-tmp" \
            -Dpaspm.test.mysql=true -Dpaspm.test.performance=true \
            -Dlogging.level.root=ERROR
      - name: Publish sanitized counts; only the allowlisted skips of the "full" profile may remain
        if: always()
        run: python3 .github/scripts/test-summary.py --allowed-skips .github/scripts/allowed-skips.txt --profile full
