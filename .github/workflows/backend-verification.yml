name: Backend verification

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
  # Verify this repair remotely even when the GitHub App cannot create a PR.
  push:
    branches: [Khoi/fix/backend-ci-remote-verification]

permissions:
  contents: read

concurrency:
  group: backend-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java 17 Backend foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Existing F01-F04 and pure F05-F06 suites
        run: mvn --batch-mode --no-transfer-progress clean verify -Dtest="$(python3 .github/scripts/test-groups.py backend)" -Dlogging.level.root=ERROR
      - name: Publish sanitized counts
        if: always()
        run: python3 .github/scripts/test-summary.py
  mysql:
    name: MySQL 8.4 / Flyway V1-V11 / F04 transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      PASPM_CI_DISPOSABLE_MYSQL: 'true'
      PASPM_TEST_MYSQL_SERVER: jdbc:mysql://127.0.0.1:3306/
      PASPM_TEST_MYSQL_USER: root
      PASPM_TEST_MYSQL_PASSWORD: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Prepare matching disposable MySQL CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paspm-bin" "$RUNNER_TEMP/paspm-tmp"
          chmod +x .github/scripts/mysql-client.sh .github/scripts/provision-restore.py
          ln -s "$GITHUB_WORKSPACE/.github/scripts/mysql-client.sh" "$RUNNER_TEMP/paspm-bin/mysql"
          ln -s "$GITHUB_WORKSPACE/.github/scripts/mysql-client.sh" "$RUNNER_TEMP/paspm-bin/mysqldump"
          echo "$RUNNER_TEMP/paspm-bin" >> "$GITHUB_PATH"
          echo "PASPM_TEST_RESTORE_PROVISIONER=$GITHUB_WORKSPACE/.github/scripts/provision-restore.py" >> "$GITHUB_ENV"
      - name: Existing MySQL migration and transaction suites
        run: |
          mvn --batch-mode --no-transfer-progress clean verify \
            -Dtest="$(python3 .github/scripts/test-groups.py mysql)" \
            -DargLine="-Djava.io.tmpdir=$RUNNER_TEMP/paspm-tmp" \
            -Dpaspm.test.mysql=true -Dlogging.level.root=ERROR
      - name: Publish sanitized counts
        if: always()
        run: python3 .github/scripts/test-summary.py
  integration:
    name: Full F01-F06 / Flyway / SPMF HUI-Miner-EFIM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      # Only the disposable loopback service, never an existing application database.
      PASPM_CI_DISPOSABLE_MYSQL: 'true'
      PASPM_TEST_MYSQL_SERVER: jdbc:mysql://127.0.0.1:3306/
      PASPM_TEST_MYSQL_USER: root
      PASPM_TEST_MYSQL_PASSWORD: ''
      PASPM_CI_SPMF_ARTIFACT_URL: ${{ vars.PASPM_CI_SPMF_ARTIFACT_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Provision separate SPMF Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Retain child executable
        run: echo "SPMF_JAVA_PATH=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - name: Provision Backend Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set isolated artifact destination
        run: echo "SPMF_JAR_PATH=$RUNNER_TEMP/spmf.jar" >> "$GITHUB_ENV"
      - name: Verify approved external artifact
        run: python3 .github/scripts/provision-spmf.py
      - name: Verify SPMF version before use
        shell: bash
        run: |
          version="$("$SPMF_JAVA_PATH" -Djava.awt.headless=true -jar "$SPMF_JAR_PATH" version)"
          [[ "$version" == *"-- SPMF version 2.67a --"* ]]
          printf '%s\n' "$version"
      - name: Prepare disposable MySQL tools and restore helper
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paspm-bin" "$RUNNER_TEMP/paspm-tmp"
          chmod +x .github/scripts/mysql-client.sh .github/scripts/provision-restore.py
          ln -s "$GITHUB_WORKSPACE/.github/scripts/mysql-client.sh" "$RUNNER_TEMP/paspm-bin/mysql"
          ln -s "$GITHUB_WORKSPACE/.github/scripts/mysql-client.sh" "$RUNNER_TEMP/paspm-bin/mysqldump"
          echo "$RUNNER_TEMP/paspm-bin" >> "$GITHUB_PATH"
          echo "PASPM_TEST_RESTORE_PROVISIONER=$GITHUB_WORKSPACE/.github/scripts/provision-restore.py" >> "$GITHUB_ENV"
          echo "PASPM_MINING_SPMF_JAR=$SPMF_JAR_PATH" >> "$GITHUB_ENV"
          echo "PASPM_MINING_JAVA_EXECUTABLE=$SPMF_JAVA_PATH" >> "$GITHUB_ENV"
      - name: Full Backend verification with all current opt-ins
        shell: bash
        run: |
          java -version
          "$SPMF_JAVA_PATH" -version
          mvn --batch-mode --no-transfer-progress clean verify \
            -DargLine="-Djava.io.tmpdir=$RUNNER_TEMP/paspm-tmp" \
            -Dpaspm.test.mysql=true \
            -Dpaspm.test.java17-backend=true \
            -Dpaspm.test.java17="$JAVA_HOME/bin/java" \
            -Dpaspm.test.spmf-jar="$SPMF_JAR_PATH" \
            -Dpaspm.test.spmf-java="$SPMF_JAVA_PATH" \
            -Dpaspm.avatar.directory="$RUNNER_TEMP/avatars" \
            -Dlogging.level.root=ERROR
      - name: Validate provisioning safeguards
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v
      - name: Publish sanitized counts and reject skipped tests
        if: always()
        run: python3 .github/scripts/test-summary.py
  required-verification:
    name: Required Backend verification
    if: always()
    needs: [backend, mysql, integration]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every technical verification group
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          MYSQL_RESULT: ${{ needs.mysql.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          if [[ "$BACKEND_RESULT" != success || "$MYSQL_RESULT" != success || "$INTEGRATION_RESULT" != success ]]; then
            echo "::error::Backend verification incomplete or failed. Missing approved SPMF provisioning is SPMF_INTEGRATION_CI_BLOCKED, never a full PASS."
            exit 1
          fi
          echo "Technical CI groups passed. Independent human review remains a separate required gate." >> "$GITHUB_STEP_SUMMARY"
