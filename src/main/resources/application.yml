server:
  port: ${PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/paspm?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:paspm}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
springdoc:
  swagger-ui:
    path: /swagger
    persist-authorization: false
paspm:
  jwt-secret: ${JWT_SECRET}
  otp-secret: ${OTP_SECRET}
  token-ttl-seconds: ${TOKEN_TTL_SECONDS:3600}
  refresh-token-absolute-ttl-seconds: ${REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS:2592000}
  refresh-token-idle-ttl-seconds: ${REFRESH_TOKEN_IDLE_TTL_SECONDS:604800}
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  otp-ttl-seconds: ${OTP_TTL_SECONDS:600}
  otp-cooldown-seconds: ${OTP_COOLDOWN_SECONDS:60}
  # DEC-20261123-01: Store images live under the media root. Avatars keep their own directory (unchanged default);
  # Docker points both at the paspm_media volume.
  media:
    root: ${PASPM_MEDIA_ROOT:${user.home}/.paspm/media}
  avatar:
    directory: ${PROFILE_IMAGE_DIRECTORY:${user.home}/.paspm/profile-images}
  mail-from: ${MAIL_FROM:no-reply@paspm.local}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  # DEC-20261119-06: layout B / baseline A zone capacities (blocks and distinct products per zone).
  layout:
    max-blocks-by-zone:
      "[BANNER]": ${PASPM_LAYOUT_MAX_BLOCKS_BANNER:3}
      "[BUNDLE]": ${PASPM_LAYOUT_MAX_BLOCKS_BUNDLE:4}
      "[CROSS_SELL]": ${PASPM_LAYOUT_MAX_BLOCKS_CROSS_SELL:2}
      "[FBT]": ${PASPM_LAYOUT_MAX_BLOCKS_FBT:2}
      "[BASELINE]": ${PASPM_LAYOUT_MAX_BLOCKS_BASELINE:35}
    max-products-by-zone:
      "[BANNER]": ${PASPM_LAYOUT_MAX_PRODUCTS_BANNER:3}
      "[BUNDLE]": ${PASPM_LAYOUT_MAX_PRODUCTS_BUNDLE:16}
      "[CROSS_SELL]": ${PASPM_LAYOUT_MAX_PRODUCTS_CROSS_SELL:8}
      "[FBT]": ${PASPM_LAYOUT_MAX_PRODUCTS_FBT:8}
      "[BASELINE]": ${PASPM_LAYOUT_MAX_PRODUCTS_BASELINE:35}
