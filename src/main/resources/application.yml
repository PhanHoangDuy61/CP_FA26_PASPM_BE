server:
  port: ${PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/paspm?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:paspm}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
springdoc:
  swagger-ui:
    path: /swagger
    persist-authorization: false
paspm:
  jwt-secret: ${JWT_SECRET}
  otp-secret: ${OTP_SECRET}
  token-ttl-seconds: ${TOKEN_TTL_SECONDS:900}
  otp-ttl-seconds: ${OTP_TTL_SECONDS:600}
  otp-cooldown-seconds: ${OTP_COOLDOWN_SECONDS:60}
  avatar:
    directory: ${PROFILE_IMAGE_DIRECTORY:${user.home}/.paspm/profile-images}
  mail-from: ${MAIL_FROM:no-reply@paspm.local}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
